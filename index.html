
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Für Emily 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #fff1f5, #ffd6e5);
      color: #74334e;
    }

    .card {
      width: min(90%, 420px);
      padding: 38px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.82);
      border: 2px solid white;
      border-radius: 30px;
      box-shadow: 0 15px 50px rgba(196, 91, 132, 0.15);
      position: relative;
      z-index: 1;
    }

    .bear {
      font-size: 75px;
      margin-bottom: 10px;
      animation: bounce 2s infinite;
    }

    h1 {
      font-size: clamp(25px, 7vw, 34px);
      margin: 10px 0;
    }

    p {
      color: #a36b82;
      font-size: 16px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 30px;
      min-height: 55px;
    }

    button {
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      padding: 15px 25px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #yes {
      color: white;
      background: #f06292;
      box-shadow: 0 5px 0 #d94e7c;
      transition: transform 0.2s;
      z-index: 2;
    }

    #yes:hover {
      transform: scale(1.08);
    }

    #no {
      color: #a45b78;
      background: #ffe1ec;
      white-space: nowrap;
      transition: left 0.15s ease, top 0.15s ease;
      z-index: 10;
    }

    #no.running {
      position: fixed;
    }

    .hint {
      font-size: 12px;
      margin-top: 28px;
      opacity: 0.7;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 20;
    }

    .hidden {
      display: none;
    }

    #success h1 {
      color: #ed5488;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <section id="question">
      <div class="bear">🥹💗</div>

      <h1>Emily, magst du mich?</h1>
      <p>Überleg dir deine Antwort gut ...<br>
         Ich schaue ganz genau hin! 👀</p>

      <div class="buttons">
        <button id="yes">Ja ❤️</button>
        <button id="no">Nein 🙈</button>
      </div>

      <p class="hint">Pssst ... es gibt nur eine richtige Antwort 😇</p>
    </section>

    <section id="success" class="hidden">
      <div class="bear">🥰💋</div>
      <h1>WUSSTE ICH ES DOCH!</h1>
      <p>
        Ich hab dich auch lieb, Emily! 💗<br><br>
        Du bist die Süßeste.<br>
        Ganz viele Küsse von deinem Emre. 💋
      </p>
      <div style="font-size: 35px">💗💕💖💗💕</div>
    </section>
  </main>

  <script>
    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    const question = document.getElementById("question");
    const success = document.getElementById("success");

    let attempts = 0;

    function moveNoButton() {
      // Erst beim ersten Ausweichen aus dem Layout lösen
      noButton.classList.add("running");

      const margin = 15;
      const maxX = window.innerWidth - noButton.offsetWidth - margin;
      const maxY = window.innerHeight - noButton.offsetHeight - margin;

      let x, y;
      const oldX = noButton.getBoundingClientRect().left;
      const oldY = noButton.getBoundingClientRect().top;

      // Möglichst weit weg von der bisherigen Position springen
      do {
        x = margin + Math.random() * Math.max(0, maxX - margin);
        y = margin + Math.random() * Math.max(0, maxY - margin);
      } while (
        Math.abs(x - oldX) < 120 &&
        Math.abs(y - oldY) < 80
      );

      noButton.style.left = x + "px";
      noButton.style.top = y + "px";

      attempts++;

      if (attempts === 3) {
        noButton.textContent = "Hihi 😝";
      } else if (attempts === 6) {
        noButton.textContent = "Erwischt mich nie 😂";
      } else if (attempts >= 9) {
        noButton.textContent = "Gib auf 🙈";
      }
    }

    // Maus: Der Button flüchtet, bevor er erreicht wird
    noButton.addEventListener("pointerenter", (event) => {
      if (event.pointerType === "mouse") {
        moveNoButton();
      }
    });

    // Handy: Ausweichen bereits beim Berühren
    noButton.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      moveNoButton();
    });

    // Zusätzliche Absicherung gegen Klicks
    noButton.addEventListener("click", (event) => {
      event.preventDefault();
      moveNoButton();
    });

    yesButton.addEventListener("click", () => {
      question.classList.add("hidden");
      success.classList.remove("hidden");

      // Konfetti aus Herzen 💗
      for (let i = 0; i < 45; i++) {
        setTimeout(createHeart, i * 65);
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";

      const emojis = ["💗", "💖", "💕", "💘", "❤️", "✨"];
      heart.textContent = emojis[
        Math.floor(Math.random() * emojis.length)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (18 + Math.random() * 25) + "px";
      heart.style.animationDuration = (2 + Math.random() * 3) + "s";

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5500);
    }

    window.addEventListener("resize", () => {
      if (noButton.classList.contains("running")) {
        const rect = noButton.getBoundingClientRect();
        const x = Math.min(rect.left, window.innerWidth - noButton.offsetWidth - 10);
        const y = Math.min(rect.top, window.innerHeight - noButton.offsetHeight - 10);

        noButton.style.left = Math.max(10, x) + "px";
        noButton.style.top = Math.max(10, y) + "px";
      }
    });
  </script>
</body>
</html>
